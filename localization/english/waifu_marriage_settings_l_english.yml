 setting_waifu_call_exemption_enabled:0 "Enabled"
 setting_waifu_call_exemption_enabled_desc:0 "No penalty for refusing a waifu's call to war (default)"
 setting_waifu_call_exemption_disabled:0 "Disabled"
 setting_waifu_call_exemption_disabled_desc:0 "Normal penalties apply when refusing waifu ally's call"

