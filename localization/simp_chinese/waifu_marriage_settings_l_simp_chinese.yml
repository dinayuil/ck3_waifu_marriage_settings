l_simp_chinese:
 rule_waifu_marriage_settings:0 "纸片人婚姻设置"
 rule_waifu_marriage_settings_desc:0 "开启后，满足 waifu_portrait_trigger 的纸片人角色只能与同为纸片人的角色结婚或订婚。需要前置模组：二向箔核心库。"
 setting_waifu_marriage_settings_enabled:0 "启用"
 setting_waifu_marriage_settings_enabled_desc:0 "纸片人只能与纸片人结婚（默认）"
 setting_waifu_marriage_settings_disabled:0 "禁用"
 setting_waifu_marriage_settings_disabled_desc:0 "关闭限制，纸片人可与任何人结婚"

 rule_waifu_same_sex_marriage:0 "纸片人同性婚姻"
 rule_waifu_same_sex_marriage_desc:0 "开启后，纸片人角色可以与同性别的其他角色结婚，无视宗教教义和其他婚姻mod的性别限制。"
 setting_waifu_same_sex_marriage_enabled:0 "启用"
 setting_waifu_same_sex_marriage_enabled_desc:0 "纸片人可与同性角色结婚（默认）"
 setting_waifu_same_sex_marriage_disabled:0 "禁用"
 setting_waifu_same_sex_marriage_disabled_desc:0 "关闭同性婚姻，纸片人也需遵循宗教性别限制"

 waifu_must_marry_waifu:0 "[SUBJECT.GetFirstName]是纸片人，只能与纸片人结婚"

 rule_waifu_call_exemption:0 "纸片人盟约拒绝豁免"
 rule_waifu_call_exemption_desc:0 "开启后，拒绝纸片人盟友的参战召唤不会扣除名声，也不会产生负面好感修正。"
 setting_waifu_call_exemption_enabled:0 "启用"
